<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyoMap · 动作库</title>
<script src="assets/js/theme.js?v=2"></script>
<link rel="stylesheet" href="assets/css/common.css?v=3">
</head>
<body>
<div class="app">
  <div id="nav-mount"></div>
  <div class="main">
    <header class="topbar">
      <div class="page-title" id="page-title"></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <main class="content">
      <div id="guest-bar"></div>

      <!-- 动作库统计 -->
      <div class="grid grid-4" id="lib-stats" style="margin-bottom:18px;"></div>

      <div class="card">
        <div class="flex flex-wrap gap-12 items-center">
          <input class="input" id="q" placeholder=" 搜索动作名称 / 肌群 / 器械…" style="flex:1;min-width:220px;">
          <select class="select" id="f-diff" aria-label="按难度筛选" style="width:140px;"><option value="">全部难度</option></select>
          <select class="select" id="f-equip" aria-label="按器械筛选" style="width:150px;"><option value="">全部器械</option></select>
          <button class="btn btn-ghost" id="btn-reset">重置</button>
          <button class="btn btn-ghost" id="btn-beginner"><i class="ic" data-ic="sprout" data-ic-size="14"></i> 新手入门指导</button>
          <button class="btn btn-primary" id="btn-add-custom">＋ 自定义动作</button>
        </div>
        <div class="divider"></div>
        <div class="tabs" id="muscle-tabs" style="margin-bottom:0;"></div>
      </div>

      <div class="flex items-center justify-between" style="margin:18px 2px 12px;">
        <div class="muted" id="result-count" style="font-size:13px;">共 0 个动作</div>
        <select class="select" id="sort" aria-label="排序方式" style="width:170px;">
          <option value="default">默认排序</option>
          <option value="compound">复合动作优先</option>
          <option value="name">按名称</option>
        </select>
      </div>

      <div class="ex-grid" id="grid"></div>
      <div class="center" style="margin-top:22px;">
        <button class="btn btn-ghost hidden" id="load-more">加载更多</button>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/exercises-data.js"></script>
<script src="assets/js/icons.js?v=2"></script>
<script src="assets/js/common.js?v=3"></script>
<script>
Common.shell({ active: 'library', title: '标准动作库', subtitle: '内置 ' + (window.MYOMAP_EXERCISES || []).length + '+ 个标准动作 · 支持搜索与筛选', public: true });

(function () {
  if (!Store.isGuest()) return;
  document.getElementById('guest-bar').innerHTML =
    '<div class="guest-bar"><i class="ic" data-ic="user"></i> <b>游客模式</b>：可自由浏览与搜索动作库；登录后可创建自定义动作并加入训练计划。' +
    '<a class="btn btn-sm btn-primary" href="login.html?next=library.html">立即登录</a></div>';
})();

const state = { q: '', muscle: '', difficulty: '', equipment: '', sort: 'default' };
const LIB_STATS = Common.muscleStats();

// 动作库统计卡片
(function () {
  const items = [
    { ico: 'dumbbell', val: LIB_STATS.total, label: '动作总数' },
    { ico: 'target', val: LIB_STATS.muscles, label: '覆盖肌群' },
    { ico: 'sprout', val: LIB_STATS.byDiff['初级'], label: '初级动作' },
    { ico: 'award', val: LIB_STATS.byDiff['中级'] + LIB_STATS.byDiff['高级'], label: '中 / 高级动作' }
  ];
  document.getElementById('lib-stats').innerHTML = items.map(function (it) {
    return '<div class="stat"><span class="stat-ico"><i class="ic" data-ic="' + it.ico + '" data-ic-size="20"></i></span>' +
      '<span class="stat-val">' + it.val + '</span><span class="stat-label">' + it.label + '</span></div>';
  }).join('');
})();

// 初始化筛选器
(function () {
  const fd = document.getElementById('f-diff');
  Common.DIFFICULTIES.forEach(d => fd.insertAdjacentHTML('beforeend', '<option>' + d + '</option>'));
  const fe = document.getElementById('f-equip');
  Common.EQUIPMENTS.forEach(e => fe.insertAdjacentHTML('beforeend', '<option>' + e + '</option>'));
  const tabs = document.getElementById('muscle-tabs');
  tabs.innerHTML = '<button class="tab active" data-m="">全部肌群 ' + LIB_STATS.total + '</button>' +
    Common.MUSCLE_GROUPS.map(m => '<button class="tab" data-m="' + Common.esc(m) + '">' + Common.esc(m) + ' <span class="mute">' + (LIB_STATS.byMuscle[m] || 0) + '</span></button>').join('');
  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    tabs.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.muscle = t.dataset.m;
    render();
  });
})();

document.getElementById('btn-beginner').onclick = function () { Common.beginnerGuideModal(); };
document.getElementById('load-more').onclick = function () { loadMore(); };

function render() {
  let list = Common.searchExercises(state);
  if (state.sort === 'compound') list = Common.sortByCompound(list);
  else if (state.sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  const byDiff = { '初级': 0, '中级': 0, '高级': 0 };
  list.forEach(function (e) { if (byDiff[e.difficulty] != null) byDiff[e.difficulty]++; });
  document.getElementById('result-count').innerHTML =
    '共 <b class="highlight-num">' + list.length + '</b> 个动作' + (state.muscle ? ' · ' + Common.esc(state.muscle) : '') +
    ' · 初级 ' + byDiff['初级'] + ' / 中级 ' + byDiff['中级'] + ' / 高级 ' + byDiff['高级'] +
    ' · <span class="mute">点击卡片查看分步指导</span>';
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><div class="empty-ico"><i class="ic" data-ic="search" data-ic-size="44"></i></div><div class="empty-title">没有找到匹配的动作</div><div class="empty-hint">试试更换筛选条件</div></div>';
    document.getElementById('load-more').classList.add('hidden');
    return;
  }
  filtered = list;
  shown = 0;
  grid.innerHTML = '';
  loadMore();
}

const PAGE_SIZE = 48;
let filtered = [], shown = 0;

function cardHtml(ex) {
  return '<div class="ex-card" data-name="' + Common.esc(ex.name) + '">' +
    '<div class="ex-thumb">' +
      (ex.gif ? '<img src="' + Common.esc(ex.gif) + '" alt="' + Common.esc(ex.name) + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
        '<span class="ex-ph" style="display:none;"><i class="ic" data-ic="dumbbell"></i></span>' : '<span class="ex-ph"><i class="ic" data-ic="dumbbell"></i></span>') +
    '</div>' +
    '<div class="ex-body">' +
      '<div class="ex-name">' + Common.esc(ex.name) + '</div>' +
      '<div class="ex-meta">' +
        '<span class="tag tag-accent">' + Common.esc(ex.muscle) + '</span>' +
        '<span class="tag">' + Common.esc(ex.type) + '</span>' +
        '<span class="tag">' + Common.esc(ex.difficulty) + '</span>' +
      '</div>' +
      '<div class="ex-actions">' +
        '<button class="btn btn-sm btn-ghost" data-guide style="flex:1;"><i class="ic" data-ic="note" data-ic-size="13"></i> 指导</button>' +
        '<button class="btn btn-sm btn-ghost" data-add style="flex:1;">加入计划</button>' +
        '<button class="btn btn-sm btn-primary" data-work style="flex:1;">去训练</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function bindCard(card) {
  const name = card.dataset.name;
  card.querySelector('.ex-thumb').onclick = () => Common.showExerciseDetail(name);
  card.querySelector('.ex-name').onclick = () => Common.showExerciseDetail(name);
  card.querySelector('[data-guide]').onclick = (e) => { e.stopPropagation(); Common.showExerciseDetail(name); };
  card.querySelector('[data-add]').onclick = (e) => { e.stopPropagation(); addToPlan(name); };
  card.querySelector('[data-work]').onclick = (e) => { e.stopPropagation(); addToWorkout(name); };
}

function loadMore() {
  const grid = document.getElementById('grid');
  const next = filtered.slice(shown, shown + PAGE_SIZE);
  shown += next.length;
  const tmp = document.createElement('div');
  tmp.innerHTML = next.map(cardHtml).join('');
  while (tmp.firstChild) {
    const card = tmp.firstChild;
    grid.appendChild(card);
    bindCard(card);
  }
  const btn = document.getElementById('load-more');
  const remain = filtered.length - shown;
  if (remain > 0) {
    btn.classList.remove('hidden');
    btn.textContent = '加载更多（剩余 ' + remain + ' 个）';
  } else {
    btn.classList.add('hidden');
  }
}

function addToPlan(name) {
  if (!Common.guardLogin('训练计划')) return;
  const ex = Common.findExercise(name);
  const sel = JSON.parse(localStorage.getItem('myomap:selection') || '[]');
  if (ex && ex.muscle && sel.indexOf(ex.muscle) === -1) sel.push(ex.muscle);
  localStorage.setItem('myomap:selection', JSON.stringify(sel));
  const draft = JSON.parse(localStorage.getItem('myomap:draftExercises') || '[]');
  if (draft.indexOf(name) === -1) draft.push(name);
  localStorage.setItem('myomap:draftExercises', JSON.stringify(draft));
  Common.toast('已加入计划草稿：' + name, 'ok');
}
function addToWorkout(name) {
  if (!Common.guardLogin('训练记录')) return;
  const list = JSON.parse(localStorage.getItem('myomap:workoutQueue') || '[]');
  if (list.indexOf(name) === -1) list.push(name);
  localStorage.setItem('myomap:workoutQueue', JSON.stringify(list));
  Common.toast('已加入训练队列（' + list.length + ' 个动作）', 'ok');
}

document.getElementById('q').addEventListener('input', Common.debounce(e => { state.q = e.target.value; render(); }, 220));
document.getElementById('f-diff').onchange = e => { state.difficulty = e.target.value; render(); };
document.getElementById('f-equip').onchange = e => { state.equipment = e.target.value; render(); };
document.getElementById('sort').onchange = e => { state.sort = e.target.value; render(); };
document.getElementById('btn-reset').onclick = () => {
  state.q = state.muscle = state.difficulty = state.equipment = '';
  state.sort = 'default';
  document.getElementById('q').value = '';
  document.getElementById('f-diff').value = '';
  document.getElementById('f-equip').value = '';
  document.getElementById('sort').value = 'default';
  document.querySelectorAll('#muscle-tabs .tab').forEach((t, i) => t.classList.toggle('active', i === 0));
  render();
};

// 自定义动作 (FR-03-13)
document.getElementById('btn-add-custom').onclick = function () {
  if (!Common.guardLogin('自定义动作')) return;
  const m = Common.openModal(
    '<div class="modal-title">＋ 新增自定义动作</div>' +
    '<div class="modal-sub">创建属于你的训练动作</div>' +
    '<div class="field"><label class="label">动作名称</label><input class="input" id="ce-name" placeholder="如：地雷管推举"></div>' +
    '<div class="input-row">' +
      '<div class="field"><label class="label">目标肌群</label><select class="select" id="ce-muscle">' +
        Common.MUSCLE_GROUPS.map(x => '<option>' + x + '</option>').join('') + '</select></div>' +
      '<div class="field"><label class="label">动作类型</label><select class="select" id="ce-type">' +
        ['推','拉','蹲','举','弯举','卷腹','拉伸'].map(x => '<option>' + x + '</option>').join('') + '</select></div>' +
    '</div>' +
    '<div class="input-row">' +
      '<div class="field"><label class="label">难度</label><select class="select" id="ce-diff">' +
        Common.DIFFICULTIES.map(x => '<option>' + x + '</option>').join('') + '</select></div>' +
      '<div class="field"><label class="label">器械</label><input class="input" id="ce-equip" placeholder="如：杠铃"></div>' +
    '</div>' +
    '<div class="field"><label class="label">备注 / 动作说明</label><textarea class="textarea" id="ce-note" placeholder="动作要点…"></textarea></div>' +
    '<div class="flex gap-12" style="justify-content:flex-end;">' +
      '<button class="btn btn-ghost" data-x>取消</button><button class="btn btn-primary" data-ok>保存动作</button></div>');
  m.el.querySelector('[data-x]').onclick = m.close;
  m.el.querySelector('[data-ok]').onclick = () => {
    const name = m.el.querySelector('#ce-name').value.trim();
    if (!name) { Common.toast('请填写动作名称', 'warn'); return; }
    Store.addCustomExercise({
      name: name,
      en: '', muscle: m.el.querySelector('#ce-muscle').value,
      bodyPart: '', type: m.el.querySelector('#ce-type').value,
      difficulty: m.el.querySelector('#ce-diff').value,
      equipment: m.el.querySelector('#ce-equip').value || '其他',
      instructions: m.el.querySelector('#ce-note').value || '自定义动作',
      tips: '', gif: ''
    });
    m.close();
    Common.toast('自定义动作已保存', 'ok');
    render();
  };
};

render();
</script>
</body>
</html>
