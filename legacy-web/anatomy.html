<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医学人体肌肉解剖图 - 交互式UI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(ellipse at top, #1a2030 0%, #0a0e18 60%, #050810 100%);
            color: #e8eef5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 顶部导航 */
        .top-bar {
            background: rgba(15, 20, 32, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(80, 120, 180, 0.2);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
        }
        .brand-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .brand span { color: #e74c3c; }
        .top-meta {
            font-size: 12px;
            color: #6b7a90;
            letter-spacing: 1px;
        }

        /* 主容器 */
        .main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            padding: 24px 32px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 65px);
        }

        /* 左侧：人体图区 */
        .anatomy-stage {
            background: linear-gradient(180deg, rgba(20,28,44,0.6) 0%, rgba(10,14,24,0.6) 100%);
            border: 1px solid rgba(80, 120, 180, 0.15);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stage-toolbar {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .view-switch {
            display: flex;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(80, 120, 180, 0.25);
            border-radius: 10px;
            overflow: hidden;
        }
        .view-btn {
            padding: 10px 24px;
            background: transparent;
            border: none;
            color: #8a9ab0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
        }
        .view-btn:hover { color: #e8eef5; background: rgba(255,255,255,0.04); }
        .view-btn.active {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
        }

        .tool-btn {
            padding: 10px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(80, 120, 180, 0.25);
            border-radius: 10px;
            color: #b8c4d4;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.25s;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

        /* SVG 容器 */
        .svg-wrap {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .body-svg {
            width: 100%;
            max-width: 520px;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
        }

        /* 人体轮廓（背景层） */
        .body-outline {
            fill: #1a2236;
            stroke: #2a3650;
            stroke-width: 1.5;
        }

        /* 肌肉通用样式 */
        .muscle {
            fill: #c0392b;
            fill-opacity: 0.55;
            stroke: #2a0a08;
            stroke-width: 1;
            cursor: pointer;
            transition: fill-opacity 0.2s, filter 0.2s, fill 0.2s;
        }
        .muscle:hover {
            fill: #ff6b4a;
            fill-opacity: 0.92;
            filter: drop-shadow(0 0 8px rgba(255,107,74,0.8)) brightness(1.15);
        }
        .muscle.dimmed { fill-opacity: 0.2; }

        /* 骨骼/参考线 */
        .skeleton-line {
            stroke: #3a4660;
            stroke-width: 1;
            fill: none;
            opacity: 0.5;
        }

        /* 内嵌标签 */
        .muscle-label {
            fill: #fff;
            font-size: 9px;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
            opacity: 0.85;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: rgba(10, 14, 24, 0.96);
            border: 1px solid #e74c3c;
            border-radius: 8px;
            padding: 10px 14px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transform: translate(-50%, -130%);
            transition: opacity 0.15s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 0 1px rgba(231,76,60,0.2);
            min-width: 140px;
        }
        .tooltip.visible { opacity: 1; }
        .tooltip-name {
            font-size: 15px;
            font-weight: 700;
            color: #ff6b4a;
            margin-bottom: 4px;
        }
        .tooltip-en {
            font-size: 11px;
            color: #8a9ab0;
            font-style: italic;
        }
        .tooltip-hint {
            font-size: 10px;
            color: #5a6878;
            margin-top: 6px;
            border-top: 1px solid rgba(138,154,176,0.2);
            padding-top: 6px;
        }

        /* 右侧信息面板 */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .info-card {
            background: linear-gradient(180deg, rgba(20,28,44,0.7) 0%, rgba(10,14,24,0.7) 100%);
            border: 1px solid rgba(80, 120, 180, 0.18);
            border-radius: 14px;
            padding: 20px;
        }
        .info-card h3 {
            font-size: 13px;
            color: #8a9ab0;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-card h3::before {
            content: '';
            width: 3px; height: 14px;
            background: #e74c3c;
            border-radius: 2px;
        }

        .selected-box {
            min-height: 90px;
        }
        .selected-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .selected-en {
            font-size: 13px;
            color: #8a9ab0;
            font-style: italic;
            margin-bottom: 12px;
        }
        .selected-id {
            display: inline-block;
            font-size: 11px;
            font-family: 'SF Mono', Consolas, monospace;
            background: rgba(231,76,60,0.12);
            color: #ff6b4a;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(231,76,60,0.3);
        }
        .selected-empty {
            color: #5a6878;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        .jump-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 12px;
        }
        .jump-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(231,76,60,0.4); }
        .jump-btn:disabled {
            background: rgba(255,255,255,0.06);
            color: #5a6878;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 肌肉列表 */
        .muscle-list {
            max-height: 360px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .muscle-list::-webkit-scrollbar { width: 6px; }
        .muscle-list::-webkit-scrollbar-track { background: transparent; }
        .muscle-list::-webkit-scrollbar-thumb { background: rgba(138,154,176,0.3); border-radius: 3px; }

        .list-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .list-item:hover { background: rgba(231,76,60,0.12); }
        .list-item.active { background: rgba(231,76,60,0.2); color: #ff6b4a; }
        .list-item-en { font-size: 11px; color: #6b7a90; font-style: italic; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(80,120,180,0.1);
            font-size: 13px;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #8a9ab0; }
        .stat-value { color: #ff6b4a; font-weight: 600; }

        .legend {
            font-size: 12px;
            color: #6b7a90;
            line-height: 1.7;
        }
        .legend kbd {
            background: rgba(255,255,255,0.08);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            color: #b8c4d4;
        }

        /* 隐藏 */
        .hidden { display: none !important; }

        /* 响应式 */
        @media (max-width: 960px) {
            .main { grid-template-columns: 1fr; }
        }
    </style>
</head>

                <div class="legend">
                    • <kbd>悬停</kbd> 肌肉区域显示名称<br>
                    • <kbd>点击</kbd> 肌肉选中并高亮<br>
                    • <kbd>标签</kbd> 切换内嵌文字标签<br>
                    • <kbd>跳转</kbd> 按钮预留：填写 URL 后即可跳转到对应肌肉详情页

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <div class="tooltip-name" id="tt-name"></div>
        <div class="tooltip-en" id="tt-en"></div>
        <div class="tooltip-hint">点击选中 · ID: <span id="tt-id"></span></div>
    </div>

    <script>
        // ===== 肌肉数据：后期跳转 URL 在此配置（id -> url） =====
        const MUSCLE_LINKS = {
            // 示例（取消注释并替换为真实页面）：
            // 'pectoralis_major': 'muscle-detail/pectoralis.html',
            // 'biceps_brachii': 'muscle-detail/biceps.html',
        };

        // ===== 状态 =====
        let currentView = 'front';
        let selectedMuscleId = null;
        let labelsVisible = false;

        // ===== 视图切换 =====
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
            document.getElementById('front-view').classList.toggle('hidden', view !== 'front');
            document.getElementById('back-view').classList.toggle('hidden', view !== 'back');
            resetSelection();
            buildMuscleList();
        }

        // ===== Tooltip =====
        const tooltip = document.getElementById('tooltip');
        const ttName = document.getElementById('tt-name');
        const ttEn = document.getElementById('tt-en');
        const ttId = document.getElementById('tt-id');

        function showTooltip(e, el) {
            const name = el.getAttribute('data-name');
            const en = el.getAttribute('data-name-en');
            const id = el.getAttribute('data-muscle-id');
            ttName.textContent = name;
            ttEn.textContent = en;
            ttId.textContent = id;
            tooltip.classList.add('visible');
            moveTooltip(e);
        }
        function moveTooltip(e) {
            tooltip.style.left = e.clientX + 'px';
            tooltip.style.top = e.clientY + 'px';
        }
        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        // ===== 选中肌肉 =====
        function selectMuscle(el) {
            const id = el.getAttribute('data-muscle-id');
            const name = el.getAttribute('data-name');
            const en = el.getAttribute('data-name-en');

            // 清除之前的高亮
            document.querySelectorAll('.muscle.selected').forEach(m => m.classList.remove('selected'));
            // 高亮所有同 id 的肌肉（左右对称）
            document.querySelectorAll(`.muscle[data-muscle-id="${id}"]`).forEach(m => {
                m.classList.add('selected');
            });
            selectedMuscleId = id;

            // 更新信息面板
            const hasLink = MUSCLE_LINKS[id];
            document.getElementById('selected-content').innerHTML = `
                <div class="selected-name">${name}</div>
                <div class="selected-en">${en}</div>
                <div class="selected-id">data-muscle-id: ${id}</div>
                <button class="jump-btn" ${hasLink ? '' : 'disabled'} onclick="jumpToMuscle('${id}')">
                    ${hasLink ? ' 查看详情页' : ' 跳转页面（待配置）'}
                </button>
            `;

            // 高亮列表项
            document.querySelectorAll('.list-item').forEach(item => {
                item.classList.toggle('active', item.dataset.muscleId === id);
            });
        }

        function resetSelection() {
            document.querySelectorAll('.muscle.selected').forEach(m => m.classList.remove('selected'));
            selectedMuscleId = null;
            document.getElementById('selected-content').innerHTML =
                '<div class="selected-empty">将鼠标悬停在人体肌肉上查看详情<br>点击肌肉以选中</div>';
            document.querySelectorAll('.list-item').forEach(item => item.classList.remove('active'));
        }

        // ===== 跳转（后期加装） =====
        function jumpToMuscle(id) {
            const url = MUSCLE_LINKS[id];
            if (url) {
                window.location.href = url;
            } else {
                console.log('[跳转预留] 肌肉ID:', id, '— 请在 MUSCLE_LINKS 中配置 URL');
            }
        }

        // ===== 标签切换 =====
        function toggleLabels() {
            labelsVisible = !labelsVisible;
            const svg = document.getElementById(currentView + '-view');
            // 移除已有标签
            svg.querySelectorAll('.dynamic-label').forEach(t => t.remove());
            if (labelsVisible) {
                document.querySelectorAll(`#${currentView}-view .muscle`).forEach(m => {
                    const id = m.getAttribute('data-muscle-id');
                    const name = m.getAttribute('data-name');
                    // 只为每个 id 添加一个标签（避免左右重复）
                    if (svg.querySelector(`.dynamic-label[data-for="${id}"]`)) return;
                    try {
                        const bbox = m.getBBox();
                        const cx = bbox.x + bbox.width / 2;
                        const cy = bbox.y + bbox.height / 2;
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', cx);
                        text.setAttribute('y', cy);
                        text.setAttribute('class', 'muscle-label dynamic-label');
                        text.setAttribute('data-for', id);
                        text.textContent = name.length > 4 ? name.slice(0, 4) : name;
                        svg.appendChild(text);
                    } catch (err) { /* ignore */ }
                });
            }
        }

        // ===== 构建肌肉列表 =====
        function buildMuscleList() {
            const svg = document.getElementById(currentView + '-view');
            const seen = new Map();
            svg.querySelectorAll('.muscle').forEach(m => {
                const id = m.getAttribute('data-muscle-id');
                if (!seen.has(id)) {
                    seen.set(id, {
                        name: m.getAttribute('data-name'),
                        en: m.getAttribute('data-name-en')
                    });
                }
            });
            const list = document.getElementById('muscle-list');
            list.innerHTML = '';
            const entries = Array.from(seen.entries()).sort((a, b) => a[1].name.localeCompare(b[1].name, 'zh'));
            entries.forEach(([id, info]) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.dataset.muscleId = id;
                item.innerHTML = `<span>${info.name}</span><span class="list-item-en">${info.en}</span>`;
                item.addEventListener('click', () => {
                    const target = svg.querySelector(`.muscle[data-muscle-id="${id}"]`);
                    if (target) selectMuscle(target);
                });
                list.appendChild(item);
            });
            document.getElementById('list-count').textContent = `共 ${entries.length} 块`;
        }

        // ===== 事件绑定 =====
        function bindMuscleEvents() {
            document.querySelectorAll('.muscle').forEach(m => {
                m.addEventListener('mouseenter', e => showTooltip(e, m));
                m.addEventListener('mousemove', moveTooltip);
                m.addEventListener('mouseleave', hideTooltip);
                m.addEventListener('click', () => selectMuscle(m));
            });
        }

        // ===== 初始化 =====
        bindMuscleEvents();
        buildMuscleList();
    </script>
