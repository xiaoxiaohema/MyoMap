<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyoMap · 训练记录</title>
<script src="assets/js/theme.js?v=2"></script>
<link rel="stylesheet" href="assets/css/common.css?v=3">
<style>
  .timer-bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .timer-item { text-align: center; }
  .timer-item .tv { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .timer-item .tl { font-size: 11px; color: var(--text-mute); }
  .set-table { width: 100%; border-collapse: collapse; }
  .set-table th { font-size: 11px; color: var(--text-mute); text-transform: uppercase; padding: 8px 6px; text-align: center; }
  .set-table td { padding: 6px; text-align: center; }
  .set-table input[type=number] { width: 100%; max-width: 92px; padding: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); text-align: center; font-size: 14px; }
  .set-table input:focus { outline: none; border-color: var(--accent); }
  .wt-cell { display: flex; align-items: center; justify-content: center; gap: 5px; }
  .wt-cell input { max-width: 62px !important; }
  .wt-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); cursor: pointer; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all .18s; }
  .wt-btn:hover { border-color: var(--accent); color: var(--accent-2); background: rgba(255,107,53,0.12); }
  .wt-btn:active { transform: scale(0.9); }
  .set-table tr.done td { background: rgba(46,204,113,0.07); }
  .set-check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border-strong); background: transparent; cursor: pointer; color: var(--text-mute); font-size: 15px; }
  .set-check.on { background: var(--green); border-color: var(--green); color: var(--on-accent); }
  .rest-fab { position: fixed; right: 24px; bottom: 24px; z-index: 120; background: var(--panel-solid); border: 1px solid var(--accent); border-radius: 16px; padding: 14px 18px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: none; }
  .rest-fab.show { display: block; animation: pop .3s cubic-bezier(.34,1.5,.64,1); }
  .rest-fab .rv { font-size: 30px; font-weight: 800; color: var(--accent-2); font-variant-numeric: tabular-nums; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ex-tab { padding: 8px 12px; border-radius: 9px; background: var(--surface-1); border: 1px solid var(--border); font-size: 12.5px; cursor: pointer; color: var(--text-dim); }
  .ex-tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .ex-tab.done { opacity: .6; }
</style>
</head>
<body>
<div class="app">
  <div id="nav-mount"></div>
  <div class="main">
    <header class="topbar">
      <div class="page-title" id="page-title"></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="rest-fab" id="rest-fab">
  <div class="rv" id="rest-val">60</div>
  <div class="mute" style="font-size:11px;">组间休息</div>
  <button class="btn btn-sm btn-ghost" id="rest-skip" style="margin-top:8px;">跳过</button>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/exercises-data.js"></script>
<script src="assets/js/icons.js?v=2"></script>
<script src="assets/js/common.js?v=3"></script>
<script>
Common.shell({ active: 'workout', title: '训练记录', subtitle: '训练模式 · 容量统计 · 1RM 估算' });

let session = null;
let timerHandle = null;
let restHandle = null;

function queueFromStorage() {
  let q = [];
  try { q = JSON.parse(localStorage.getItem('myomap:workoutQueue') || '[]'); } catch (e) {}
  return q.map(item => typeof item === 'string' ? { name: item } : item);
}

// ---------- 入口：准备训练 ----------
function renderSetup() {
  const q = queueFromStorage();
  const planName = localStorage.getItem('myomap:workoutPlanName') || '自由训练';
  const content = document.getElementById('content');
  content.innerHTML =
    '<div class="grid grid-2" style="align-items:start;">' +
      '<div class="card">' +
        '<div class="card-title"><span class="ct-ico"><i class="ic" data-ic="clipboard"></i></span> 本次训练动作 <span class="ct-sub">' + Common.esc(planName) + '</span></div>' +
        (q.length
          ? '<div style="display:flex;flex-direction:column;gap:8px;">' + q.map((e, i) => {
              const meta = Common.findExercise(e.name);
              return '<div class="ex-row"><span class="ex-idx">' + (i + 1) + '</span>' +
                '<span class="ex-nm">' + Common.esc(e.name) + '</span>' +
                '<span class="ex-sr">' + (meta ? Common.esc(meta.muscle) : '') + '</span>' +
                '<span class="ex-sr">' + (e.sets || 3) + '组 × ' + (e.reps || '10') + '</span></div>';
            }).join('') + '</div>'
          : '<div class="empty"><div class="empty-ico"><i class="ic" data-ic="dumbbell"></i></div><div class="empty-title">训练队列为空</div><div class="empty-hint">从动作库或训练计划添加动作，或直接快速开始</div></div>') +
        '<div class="flex gap-8" style="margin-top:16px;">' +
          '<button class="btn btn-ghost" id="btn-pick">＋ 添加动作</button>' +
          '<button class="btn btn-ghost" id="btn-quick"><i class="ic" data-ic="bolt"></i> 快速全身</button>' +
          '<button class="btn btn-primary" id="btn-start" style="margin-left:auto;"' + (q.length ? '' : ' disabled') + '>▶ 开始训练</button>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title"><span class="ct-ico"><i class="ic" data-ic="trendingUp"></i></span> 最近训练</div>' +
        '<div id="recent-logs"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('btn-start').onclick = startSession;
  document.getElementById('btn-pick').onclick = openPicker;
  document.getElementById('btn-quick').onclick = () => {
    const quick = ['杠铃卧推', '杠铃深蹲', '杠铃俯身划船', '哑铃推举', '平板支撑'];
    localStorage.setItem('myomap:workoutQueue', JSON.stringify(quick.map(n => ({ name: n, sets: 3, reps: '10', rest: 60 }))));
    localStorage.setItem('myomap:workoutPlanName', '快速全身');
    renderSetup();
  };
  renderRecentLogs();
}

function openPicker() {
  const all = Common.sortByCompound(Common.allExercises());
  const m = Common.openModal(
    '<div class="modal-title">＋ 添加训练动作</div>' +
    '<input class="input" id="pk-q" placeholder=" 搜索动作…" style="margin:12px 0;">' +
    '<div id="pk-list" style="max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>', { large: true });
  const listEl = m.el.querySelector('#pk-list');
  function paint(q) {
    q = (q || '').toLowerCase();
    const list = all.filter(e => !q || e.name.toLowerCase().indexOf(q) >= 0).slice(0, 80);
    listEl.innerHTML = list.map(e =>
      '<div class="ex-row" data-name="' + Common.esc(e.name) + '" style="cursor:pointer;">' +
        '<span class="ex-nm">' + Common.esc(e.name) + '</span>' +
        '<span class="tag tag-accent">' + Common.esc(e.muscle) + '</span></div>').join('');
    listEl.querySelectorAll('[data-name]').forEach(r => r.onclick = () => {
      const q2 = queueFromStorage();
      if (!q2.some(x => x.name === r.dataset.name)) q2.push({ name: r.dataset.name, sets: 3, reps: '10', rest: 60 });
      localStorage.setItem('myomap:workoutQueue', JSON.stringify(q2));
      m.close(); renderSetup(); Common.toast('已添加：' + r.dataset.name, 'ok');
    });
  }
  paint('');
  m.el.querySelector('#pk-q').addEventListener('input', Common.debounce(e => paint(e.target.value), 160));
}

function renderRecentLogs() {
  const logs = Store.getLogs().slice(0, 5);
  const el = document.getElementById('recent-logs');
  if (!logs.length) { el.innerHTML = '<div class="mute" style="font-size:13px;padding:10px 0;">暂无训练记录</div>'; return; }
  el.innerHTML = logs.map(l =>
    '<div class="kv"><span class="k">' + Common.fmtDate(l.startedAt) + ' · ' + Common.esc(l.planName || '训练') + '</span>' +
      '<span class="v">' + l.totalSets + '组 · ' + Math.round(l.totalVolume) + 'kg</span></div>').join('');
}

// ---------- 训练模式 ----------
function startSession() {
  const q = queueFromStorage();
  if (!q.length) return;
  session = {
    planName: localStorage.getItem('myomap:workoutPlanName') || '自由训练',
    startedAt: Date.now(),
    current: 0,
    exercises: q.map(item => {
      const meta = Common.findExercise(item.name) || {};
      const targetSets = item.sets || 3;
      const rows = [];
      for (let i = 0; i < targetSets; i++) rows.push({ weight: '', reps: item.reps && !isNaN(parseInt(item.reps)) ? parseInt(item.reps) : '', toFailure: false, done: false });
      return { name: item.name, muscle: meta.muscle || '', rest: item.rest || 60, targetSets, targetReps: item.reps || '10', gif: meta.gif || '', sets: rows };
    })
  };
  renderTraining();
  timerHandle = setInterval(updateTimer, 1000);
  Common.toast('训练开始，加油！', 'ok');
}

function elapsedSec() { return Math.floor((Date.now() - session.startedAt) / 1000); }
function fmtDur(s) { const m = Math.floor(s / 60), ss = s % 60; return m + ':' + String(ss).padStart(2, '0'); }
function updateTimer() {
  const el = document.getElementById('live-dur');
  if (el) el.textContent = fmtDur(elapsedSec());
}

function sessionStats() {
  let volume = 0, setsDone = 0;
  const byMuscle = {};
  session.exercises.forEach(ex => {
    ex.sets.forEach(s => {
      if (s.done) {
        const v = (Number(s.weight) || 0) * (Number(s.reps) || 0);
        volume += v; setsDone++;
        byMuscle[ex.muscle] = (byMuscle[ex.muscle] || 0) + v;
      }
    });
  });
  return { volume: Math.round(volume), setsDone, byMuscle };
}

function renderTraining() {
  const ex = session.exercises[session.current];
  const st = sessionStats();
  const content = document.getElementById('content');
  const lastEx = findLastLog(ex.name);

  content.innerHTML =
    '<div class="card" style="position:sticky;top:70px;z-index:20;">' +
      '<div class="timer-bar">' +
        '<div class="timer-item"><div class="tv" id="live-dur">0:00</div><div class="tl">训练时长</div></div>' +
        '<div class="timer-item"><div class="tv">' + st.setsDone + '</div><div class="tl">已完成组数</div></div>' +
        '<div class="timer-item"><div class="tv">' + st.volume + '<small style="font-size:12px;">kg</small></div><div class="tl">总容量</div></div>' +
        '<div class="timer-item"><div class="tv">' + (session.current + 1) + '/' + session.exercises.length + '</div><div class="tl">动作进度</div></div>' +
        '<div style="margin-left:auto;" class="flex gap-8">' +
          '<button class="btn btn-sm btn-ghost" id="btn-pause"><i class="ic" data-ic="pause"></i> 暂停</button>' +
          '<button class="btn btn-sm btn-danger" id="btn-finish">结束训练</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="flex flex-wrap gap-8" style="margin:18px 0;">' +
      session.exercises.map((e, i) => {
        const done = e.sets.every(s => s.done);
        return '<span class="ex-tab' + (i === session.current ? ' active' : '') + (done ? ' done' : '') + '" data-i="' + i + '">' +
          (done ? '✓ ' : '') + Common.esc(e.name) + '</span>';
      }).join('') +
    '</div>' +

    '<div class="grid two-col" style="grid-template-columns:minmax(0,1fr) minmax(280px,360px);align-items:start;">' +
      '<div class="card">' +
        '<div class="flex items-center justify-between flex-wrap gap-8">' +
          '<div><div style="font-size:19px;font-weight:800;">' + Common.esc(ex.name) + '</div>' +
            '<div class="mute" style="font-size:12.5px;margin-top:4px;">目标：' + ex.targetSets + ' 组 × ' + Common.esc(String(ex.targetReps)) + ' 次 · 组间休息 ' + ex.rest + 's</div></div>' +
          '<span class="tag tag-accent">' + Common.esc(ex.muscle) + '</span>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="table-scroll"><table class="set-table">' +
          '<thead><tr><th>组</th><th>重量 (kg)</th><th>次数</th><th>力竭</th><th>1RM</th><th>完成</th></tr></thead>' +
          '<tbody>' + ex.sets.map((s, si) => {
            const orm = Common.calc1RM(Number(s.weight), Number(s.reps));
            return '<tr class="' + (s.done ? 'done' : '') + '" data-si="' + si + '">' +
              '<td><b>' + (si + 1) + '</b></td>' +
              '<td><div class="wt-cell">' +
                '<button type="button" class="wt-btn" data-wt="-1" data-si="' + si + '">−</button>' +
                '<input type="number" inputmode="decimal" step="10" min="0" data-f="weight" value="' + (s.weight === '' ? '' : s.weight) + '" placeholder="0">' +
                '<button type="button" class="wt-btn" data-wt="1" data-si="' + si + '">+</button>' +
              '</div></td>' +
              '<td><input type="number" inputmode="numeric" data-f="reps" value="' + (s.reps === '' ? '' : s.reps) + '" placeholder="0"></td>' +
              '<td><button class="set-check ' + (s.toFailure ? 'on' : '') + '" data-f="toFailure">' + (s.toFailure ? '✓' : '') + '</button></td>' +
              '<td class="highlight-num">' + (orm || '—') + '</td>' +
              '<td><button class="set-check ' + (s.done ? 'on' : '') + '" data-f="done">' + (s.done ? '✓' : '') + '</button></td>' +
            '</tr>';
          }).join('') + '</tbody>' +
        '</table></div>' +
        '<div class="flex gap-8" style="margin-top:14px;">' +
          '<button class="btn btn-sm btn-ghost" id="btn-add-set">＋ 加一组</button>' +
          '<button class="btn btn-sm btn-ghost" id="btn-del-set">－ 减一组</button>' +
          (lastEx ? '<span class="mute" style="font-size:12px;margin-left:auto;">上次最佳：' + lastEx.best1RM + 'kg 1RM · ' + lastEx.bestSet + '</span>' : '') +
        '</div>' +
        '<div class="flex gap-8" style="margin-top:16px;">' +
          '<button class="btn btn-ghost" id="btn-prev"' + (session.current === 0 ? ' disabled' : '') + '>‹ 上一个</button>' +
          '<button class="btn btn-primary" id="btn-next" style="margin-left:auto;">' + (session.current === session.exercises.length - 1 ? '完成训练 ✓' : '下一个动作 ›') + '</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title" style="font-size:13.5px;"><i class="ic" data-ic="image"></i> 动作示意</div>' +
        (ex.gif ? '<img src="' + Common.esc(ex.gif) + '" style="width:100%;border-radius:12px;background:var(--viewer-bg);" onerror="this.style.display=\'none\'">' : '<div class="mute" style="font-size:12.5px;">暂无演示图</div>') +
        '<div class="card-title" style="font-size:13.5px;margin-top:16px;"><i class="ic" data-ic="bulb"></i> 要点</div>' +
        '<div class="mute" style="font-size:12.5px;line-height:1.7;">' + Common.esc((Common.findExercise(ex.name) || {}).tips || '保持动作标准，控制离心阶段。') + '</div>' +
      '</div>' +
    '</div>';

  // 事件绑定
  content.querySelectorAll('.ex-tab').forEach(t => t.onclick = () => { session.current = Number(t.dataset.i); renderTraining(); });
  content.querySelectorAll('.set-table tbody tr').forEach(tr => {
    const si = Number(tr.dataset.si);
    tr.querySelectorAll('input').forEach(inp => inp.oninput = () => {
      session.exercises[session.current].sets[si][inp.dataset.f] = inp.value;
    });
    tr.querySelectorAll('button[data-f]').forEach(btn => btn.onclick = () => {
      const f = btn.dataset.f;
      const set = session.exercises[session.current].sets[si];
      if (f === 'toFailure') { set.toFailure = !set.toFailure; renderTraining(); return; }
      if (f === 'done') {
        if (!set.done && (set.weight === '' || set.reps === '')) { Common.toast('请先填写重量和次数', 'warn'); return; }
        set.done = !set.done;
        if (set.done) startRest(session.exercises[session.current].rest);
        renderTraining();
      }
    });
  });
  content.querySelector('#btn-add-set').onclick = () => { session.exercises[session.current].sets.push({ weight: '', reps: '', toFailure: false, done: false }); renderTraining(); };
  content.querySelector('#btn-del-set').onclick = () => { const s = session.exercises[session.current].sets; if (s.length > 1) s.pop(); renderTraining(); };
  // 重量 ±10kg
  content.querySelectorAll('.wt-btn').forEach(b => b.onclick = () => {
    const si = Number(b.dataset.si);
    const set = session.exercises[session.current].sets[si];
    const cur = Number(set.weight) || 0;
    const next = Math.max(0, cur + Number(b.dataset.wt) * 10);
    set.weight = next === 0 ? '' : String(next);
    renderTraining();
  });
  content.querySelector('#btn-prev').onclick = () => { if (session.current > 0) { session.current--; renderTraining(); } };
  content.querySelector('#btn-next').onclick = () => {
    if (session.current < session.exercises.length - 1) { session.current++; renderTraining(); }
    else finishSession();
  };
  content.querySelector('#btn-pause').onclick = togglePause;
  content.querySelector('#btn-finish').onclick = () => {
    Common.confirmModal('结束训练', '确定结束本次训练并生成训练报告吗？', finishSession, '结束训练');
  };
}

function findLastLog(name) {
  const logs = Store.getLogs();
  for (const l of logs) {
    const ex = (l.exercises || []).find(e => e.name === name);
    if (ex && ex.sets && ex.sets.length) {
      let best1RM = 0, bestSet = '';
      ex.sets.forEach(s => {
        const orm = Common.calc1RM(Number(s.weight), Number(s.reps));
        if (orm && orm > best1RM) { best1RM = orm; bestSet = s.weight + 'kg × ' + s.reps; }
      });
      if (best1RM) return { best1RM: best1RM, bestSet: bestSet, date: l.startedAt };
    }
  }
  return null;
}

let paused = false;
function togglePause() {
  paused = !paused;
  if (paused) { clearInterval(timerHandle); timerHandle = null; document.getElementById('btn-pause').textContent = '▶ 继续'; Common.toast('已暂停', 'warn'); }
  else { timerHandle = setInterval(updateTimer, 1000); Common.setHTML(document.getElementById('btn-pause'), '<i class="ic" data-ic="pause"></i> 暂停'); Common.toast('继续训练', 'ok'); }
}

// 组间休息计时
function startRest(sec) {
  const fab = document.getElementById('rest-fab');
  const val = document.getElementById('rest-val');
  let left = sec;
  val.textContent = left;
  fab.classList.add('show');
  clearInterval(restHandle);
  restHandle = setInterval(() => {
    left--;
    val.textContent = left;
    if (left <= 0) { clearInterval(restHandle); fab.classList.remove('show'); Common.toast('休息结束，开始下一组！', 'ok'); }
  }, 1000);
}
document.getElementById('rest-skip').onclick = () => {
  clearInterval(restHandle);
  document.getElementById('rest-fab').classList.remove('show');
};

// ---------- 结束与报告 ----------
function finishSession() {
  if (!session) return;
  clearInterval(timerHandle); clearInterval(restHandle);
  document.getElementById('rest-fab').classList.remove('show');
  const st = sessionStats();
  const durationSec = elapsedSec();
  const profile = Store.getProfile();
  const weight = Number(profile.weight) || 70;
  const calories = Math.round(6 * weight * (durationSec / 3600)); // MET≈6 力量训练

  const log = {
    planName: session.planName,
    startedAt: new Date(session.startedAt).toISOString(),
    endedAt: new Date().toISOString(),
    durationSec,
    totalVolume: st.volume,
    totalSets: st.setsDone,
    calories,
    exercises: session.exercises.map(e => ({
      name: e.name, muscle: e.muscle,
      sets: e.sets.filter(s => s.done).map(s => ({ weight: Number(s.weight) || 0, reps: Number(s.reps) || 0, toFailure: !!s.toFailure }))
    })).filter(e => e.sets.length)
  };
  Store.addLog(log);
  localStorage.removeItem('myomap:workoutQueue');
  localStorage.removeItem('myomap:workoutPlanName');
  showReport(log);
  session = null;
}

function showReport(log) {
  const muscleDist = {};
  log.exercises.forEach(e => {
    const v = e.sets.reduce((s, x) => s + x.weight * x.reps, 0);
    muscleDist[e.muscle || '其他'] = (muscleDist[e.muscle || '其他'] || 0) + v;
  });
  const totalV = Object.values(muscleDist).reduce((a, b) => a + b, 0) || 1;
  const distHtml = Object.entries(muscleDist).sort((a, b) => b[1] - a[1]).map(([m, v]) =>
    '<div style="margin-bottom:10px;">' +
      '<div class="flex justify-between" style="font-size:12.5px;margin-bottom:4px;"><span>' + Common.esc(m) + '</span><span class="mute">' + Math.round(v) + 'kg · ' + Math.round(v / totalV * 100) + '%</span></div>' +
      '<div class="progress"><i style="width:' + (v / totalV * 100) + '%"></i></div>' +
    '</div>').join('');

  const m = Common.openModal(
    '<div class="modal-title"><i class="ic" data-ic="award"></i> 训练报告</div>' +
    '<div class="modal-sub">' + Common.esc(log.planName) + ' · ' + Common.fmtDateTime(log.startedAt) + '</div>' +
    '<div class="grid grid-4" style="margin-bottom:20px;">' +
      '<div class="stat"><span class="stat-ico"><i class="ic" data-ic="timer"></i></span><span class="stat-val">' + fmtDur(log.durationSec) + '</span><span class="stat-label">总时长</span></div>' +
      '<div class="stat"><span class="stat-ico"><i class="ic" data-ic="dumbbell"></i></span><span class="stat-val">' + log.totalSets + '<small>组</small></span><span class="stat-label">完成组数</span></div>' +
      '<div class="stat"><span class="stat-ico"><i class="ic" data-ic="box"></i></span><span class="stat-val">' + log.totalVolume + '<small>kg</small></span><span class="stat-label">总容量</span></div>' +
      '<div class="stat"><span class="stat-ico"><i class="ic" data-ic="flame"></i></span><span class="stat-val">' + log.calories + '<small>kcal</small></span><span class="stat-label">消耗热量</span></div>' +
    '</div>' +
    '<div class="card-title" style="font-size:13.5px;">各部位训练占比</div>' +
    (distHtml || '<div class="mute">无数据</div>') +
    '<div class="flex gap-12" style="justify-content:flex-end;margin-top:20px;">' +
      '<button class="btn btn-ghost" data-close>返回</button>' +
      '<a class="btn btn-primary" href="workout.html">查看历史</a>' +
    '</div>', { large: true });
  m.el.querySelector('[data-close]').onclick = () => { m.close(); renderSetup(); };
}

  // 报告弹窗关闭后回到 setup，历史在右侧展示；此处保留扩展位
}

renderSetup();
</script>
