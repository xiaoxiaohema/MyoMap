# MyoMap · docker compose
# 用法（在项目根目录）：
#   bash deploy/build.sh
#   docker compose -f deploy/docker-compose.yml up -d --build
# 访问： http://服务器IP:8080

services:
  myomap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: myomap:latest
    container_name: myomap
    ports:
      - "8080:80"
    restart: unless-stopped
