# MyoMap · Nginx 站点配置
# 说明：
#   1) 将 dist/ 的内容作为站点根目录（Docker 中为 /usr/share/nginx/html）
#   2) 大文件 body.glb（约 8MB）已开启 gzip 与缓存
#   3) 如需 HTTPS，请用 certbot 生成证书后取消下方 443 段落注释

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 50m;

    # ---- gzip 压缩 ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    # ---- 静态资源缓存 ----
    location ~* \.(?:js|css|glb|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---- 路由（纯静态，未命中回退 404）----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- 安全响应头（可选）----
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

