# ============================================================
#  MyoMap 全栈部署：MySQL + Spring Boot 后端 + Nginx 前端
#
#  用法（在项目根目录）：
#     bash deploy/build.sh
#     docker compose -f deploy/docker-compose.full.yml up -d --build
#
#  访问：  http://服务器IP:8080        （前端）
#          后端 API 通过前端 Nginx 反向代理 /api 访问，无需单独暴露 8081
#  服务端 AI：将 MYOMAP_AI_KEY 写入 ~/.myomap.env（或 export 该变量）后启动，
#            所有访问者登录后即可直接使用，无需各自配置 API Key
#            也可直接： docker compose --env-file ~/.myomap.env -f deploy/docker-compose.full.yml up -d --build
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: myomap-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myomap
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - myomap-db:/var/lib/mysql
      - ../backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: myomap-backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/myomap?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      MYOMAP_AI_KEY: "${MYOMAP_AI_KEY:-}"
      # 允许任意来源（公网隧道域名每次会变，用 * 才能跨域调用；本地/局域网同理）
      MYOMAP_CORS_ALLOWED_ORIGINS: "*"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.full
    container_name: myomap-web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  myomap-db:
