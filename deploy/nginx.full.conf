# ============================================================
#  MyoMap · Nginx 配置（全栈部署：前端 + 后端反向代理）
#  前端静态文件由 Nginx 托管，/api/ 反向代理到 Spring Boot 后端
# ============================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml
        model/gltf-binary application/octet-stream;

    # ---- 后端 API 反向代理 ----
    # 使用变量 + Docker 内置 DNS 延迟解析，避免后端未就绪时 Nginx 启动失败
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_host "backend";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Vue 3 + Three.js 版（构建产物在 /vue/ 下，哈希路由）----
    location = /vue { return 301 /vue/; }
    location /vue/ {
        try_files $uri $uri/ /vue/index.html;
    }

    # ---- HTML 不缓存，保证前端更新即时生效 ----
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---- 3D 模型：明确 MIME + 长缓存，减少重复下载 ----
    location ~* \.glb$ {
        default_type model/gltf-binary;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(?:js|css|glb|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
