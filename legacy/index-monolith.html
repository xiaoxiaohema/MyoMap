<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyoMap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #1a1a1a; 
            min-height: 100vh; 
            color: #fff;
        }
        
        /* 右侧艺术体半透明导航面板 */
        .side-panel {
            position: fixed;
            top: 50%;
            right: 24px;
            transform: translateY(-50%);
            z-index: 100;
            background: rgba(15, 15, 18, 0.35);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .side-panel .logo {
            font-family: 'Georgia', 'Songti SC', serif;
            font-size: 20px;
            font-weight: 700;
            color: #ff6b35;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(255, 107, 53, 0.4);
        }

        .side-panel .logo span {
            color: rgba(255, 255, 255, 0.85);
        }

        .side-divider {
            width: 32px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            margin: 6px 0 10px;
        }

        .nav-item {
            width: 56px;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border-radius: 16px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.65);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            user-select: none;
        }

        .nav-item .icon {
            font-size: 22px;
            line-height: 1;
            transition: transform 0.3s;
        }

        .nav-item .label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .nav-item:hover {
            color: #ff6b35;
            background: rgba(255, 107, 53, 0.12);
            transform: translateY(-2px) scale(1.05);
        }

        .nav-item:hover .icon {
            transform: scale(1.15);
        }

        .nav-item.active {
            color: #ff6b35;
            background: rgba(255, 107, 53, 0.18);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.25);
        }

        .nav-item .tooltip-right {
            position: absolute;
            right: 68px;
            top: 50%;
            transform: translateY(-50%) translateX(10px);
            background: rgba(20, 20, 24, 0.9);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item:hover .tooltip-right {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }
        
        /* ===== 计划面板样式 ===== */
        .plan-section {
            margin-bottom: 20px;
        }
        .plan-label {
            color: rgba(255,255,255,0.85);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .plan-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .plan-option {
            padding: 10px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }
        .plan-option:hover {
            border-color: rgba(255,107,53,0.4);
            color: #fff;
        }
        .plan-option.active {
            background: rgba(255,107,53,0.18);
            border-color: #ff6b35;
            color: #fff;
            box-shadow: 0 2px 12px rgba(255,107,53,0.25);
        }

        /* ===== 小米手环接入样式 ===== */
        .miband-section {
            margin: 24px 0;
            padding: 16px;
            background: linear-gradient(135deg, rgba(46,204,113,0.06), rgba(52,152,219,0.06));
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 14px;
        }
        .miband-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .miband-connect-btn {
            padding: 8px 18px;
            background: rgba(46,204,113,0.15);
            border: 1px solid rgba(46,204,113,0.4);
            border-radius: 20px;
            color: #2ecc71;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .miband-connect-btn:hover:not(:disabled) {
            background: rgba(46,204,113,0.25);
            transform: translateY(-1px);
        }
        .miband-connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .miband-hint {
            color: rgba(255,255,255,0.45);
            font-size: 12px;
            text-align: center;
            padding: 8px 0;
        }
        .miband-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .miband-stat {
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .miband-stat-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .miband-stat-val {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }
        .miband-stat-val span {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            font-weight: 400;
            margin-left: 2px;
        }
        .miband-stat-label {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            margin-top: 2px;
        }

        /* ===== 生成计划按钮 ===== */
        .generate-plan-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255,107,53,0.3);
            letter-spacing: 1px;
        }
        .generate-plan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(255,107,53,0.45);
        }

        /* ===== 计划结果卡片 ===== */
        .plan-result-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,107,53,0.25);
            border-radius: 14px;
            padding: 20px;
            animation: planFadeIn 0.4s ease;
        }
        @keyframes planFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .plan-result-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .plan-result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .plan-result-meta span {
            padding: 5px 12px;
            background: rgba(255,107,53,0.12);
            border-radius: 14px;
            font-size: 12px;
            color: rgba(255,255,255,0.8);
        }
        .plan-exercise-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
        }
        .plan-ex-idx {
            width: 24px;
            height: 24px;
            background: rgba(255,107,53,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ff6b35;
            font-weight: 700;
            flex-shrink: 0;
        }
        .plan-ex-name {
            flex: 1;
            color: #fff;
            font-size: 14px;
        }
        .plan-ex-sets {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }

        /* ===== 增强右侧导航艺术风格 ===== */
        .side-panel {
            background: linear-gradient(160deg, rgba(20,20,28,0.45), rgba(15,15,20,0.35));
            box-shadow: 0 8px 40px rgba(0,0,0,0.5),
                        inset 0 1px 0 rgba(255,255,255,0.1),
                        inset 0 0 30px rgba(255,107,53,0.03);
        }
        .side-panel .logo {
            font-family: 'Georgia', 'Songti SC', 'STSong', serif;
            font-style: italic;
            background: linear-gradient(135deg, #ff6b35, #ff9d6c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }
        .nav-item {
            font-family: 'Georgia', 'Songti SC', serif;
        }
        .nav-item .label {
            font-family: 'Georgia', 'Songti SC', serif;
            letter-spacing: 1px;
        }

        /* 主容器 - 全屏3D模型 */
        .main-container {
            display: block;
            width: 100%;
            height: 100vh;
        }
        
        /* 左侧人体图区域 - 全屏 */
        .body-map-section {
            width: 100%;
            height: 100vh;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
        }
        
        /* 视图切换 */
        .view-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .view-btn {
            padding: 10px 30px;
            background: #333;
            border: 2px solid #444;
            border-radius: 8px;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .view-btn:hover {
            background: #444;
            color: #fff;
        }
        
        .view-btn.active {
            background: #ff6b35;
            border-color: #ff6b35;
            color: #fff;
        }
        
        /* SVG人体图 */
        .body-svg-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 500px;
        }
        
        .muscle-region {
            cursor: pointer;
            transition: all 0.3s;
            stroke: #444;
            stroke-width: 1;
        }
        
        .muscle-region:hover {
            filter: brightness(1.5);
            stroke: #ff6b35;
            stroke-width: 2;
        }
        
        .muscle-region.selected {
            filter: brightness(1.8) saturate(1.2);
            stroke: #ff6b35;
            stroke-width: 3;
            animation: muscle-pulse 1s infinite;
        }
        
        @keyframes muscle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        /* 肌肉颜色 - 不同肌肉群 */
        .muscle-chest { fill: #e74c3c; }
        .muscle-back { fill: #3498db; }
        .muscle-shoulders-front { fill: #9b59b6; }
        .muscle-shoulders-back { fill: #8e44ad; }
        .muscle-biceps { fill: #e91e63; }
        .muscle-triceps { fill: #c2185b; }
        .muscle-forearms { fill: #ad1457; }
        .muscle-abs { fill: #27ae60; }
        .muscle-obliques { fill: #2ecc71; }
        .muscle-lats { fill: #16a085; }
        .muscle-traps { fill: #1abc9c; }
        .muscle-quads { fill: #f39c12; }
        .muscle-hamstrings { fill: #e67e22; }
        .muscle-glutes { fill: #d35400; }
        .muscle-calves { fill: #f1c40f; }
        
        /* 肌肉标签 */
        .muscle-label {
            position: absolute;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .muscle-label.active {
            color: #ff6b35;
            font-size: 13px;
        }
        
        /* 当前选中提示 */
        .selected-muscle-display {
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px 25px;
            margin-top: 20px;
            text-align: center;
        }
        
        .selected-muscle-name {
            font-size: 18px;
            font-weight: 700;
            color: #ff6b35;
        }
        
        .selected-muscle-count {
            color: #aaa;
            font-size: 13px;
            margin-top: 5px;
        }
        
        /* 训练面板 - 从3D模型中心弹出 */
        .exercise-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 560px;
            max-width: 92vw;
            max-height: 88vh;
            background: rgba(18, 18, 22, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 30px;
            overflow-y: auto;
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(255,107,53,0.1);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.3s ease, visibility 0.3s ease;
            transform-origin: center center;
        }
        
        .exercise-panel.open {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }
        
        /* 面板遮罩 */
        .panel-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            z-index: 85;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .panel-backdrop.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* 关闭按钮 */
        .panel-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            z-index: 10;
        }
        .panel-close-btn:hover {
            background: #ff6b35;
            transform: rotate(90deg);
        }
        
        /* 图片放大查看模态框 */
        .image-zoom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            cursor: zoom-out;
        }
        .image-zoom-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .image-zoom-modal img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .image-zoom-modal.show img {
            transform: scale(1);
        }
        .image-zoom-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
        }
        .image-zoom-close:hover {
            background: #ff6b35;
            transform: rotate(90deg);
        }
        
        /* 登录弹窗 */
        .login-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .login-popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .login-popup {
            background: linear-gradient(145deg, #1e1e24, #16161a);
            border-radius: 20px;
            padding: 36px 32px;
            width: 360px;
            max-width: 90vw;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(255,107,53,0.15);
            position: relative;
            transform: scale(0.8) translateY(20px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }
        .login-popup-overlay.show .login-popup {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .login-popup-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: none;
            color: #999;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
        }
        .login-popup-close:hover {
            background: #ff6b35;
            color: #fff;
            transform: rotate(90deg);
        }
        .login-popup-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            text-align: center;
        }
        .login-popup-subtitle {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 24px;
        }
        .login-popup-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-popup-input:focus {
            border-color: #ff6b35;
        }
        .login-popup-input::placeholder { color: #555; }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 13px;
            margin: 4px 0 16px;
            cursor: pointer;
            user-select: none;
        }
        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff6b35;
            cursor: pointer;
        }
        .login-popup-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ff7b3a, #ff5722);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(255,87,34,0.3);
        }
        .login-popup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,87,34,0.45);
        }
        
        .exercise-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            animation: header-fade-in 0.5s ease-out 0.1s both;
        }
        @keyframes header-fade-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .exercise-title {
            font-size: 28px;
            font-weight: 700;
        }
        
        .exercise-title .muscle-name { color: #ff6b35; }
        
        .exercise-count {
            background: #ff6b35;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        /* 训练动作卡片 */
        .exercise-cards {
            display: grid;
            gap: 16px;
        }
        
        .exercise-card {
            background: rgba(30, 30, 35, 0.8);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(20px);
            animation: card-slide-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes card-slide-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .exercise-card:hover {
            border-color: rgba(255,107,53,0.5);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(255,107,53,0.15);
        }
        
        .exercise-gif-container {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .exercise-gif {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .exercise-gif-container:hover .exercise-gif {
            transform: scale(1.03);
            transition: transform 0.3s ease;
        }
        
        /* 放大提示 */
        .zoom-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;

        /* ====== 动态壁纸背景层（融合 3D 人体模型） ====== */

        .wp-bg-img {

        .wp-bg-mask {

        .wp-glow {

        .wp-glow.wp-g1 {

        }
        .wp-glow.wp-g2 {

        /* 缓慢能量扫光 */
        .wp-sweep {

        // 登录
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${BASE}/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.code === 1) {
                    token = data.data.token;
                    document.getElementById('login-overlay').classList.add('hidden');
                    initMuscleMap();
                } else {
                    document.getElementById('login-error').textContent = data.msg || '登录失败';
                }
            } catch (e) {
                // 后端未启动时，本地模式直接进入页面查看3D模型
                document.getElementById('login-overlay').classList.add('hidden');
                initMuscleMap();
            }
        }
        
        // 初始化肌肉图
        function initMuscleMap() {
            document.querySelectorAll('.muscle-region').forEach(region => {
                region.addEventListener('click', () => {
                    const muscle = region.dataset.muscle;
                    selectMuscle(muscle, region);
                });
            });
        }
        
        // 选择肌肉
        function selectMuscle(muscle, element) {
            selectedMuscle = muscle;
            
            // 更新高亮
            document.querySelectorAll('.muscle-region').forEach(r => r.classList.remove('selected'));
            if (element) {
                element.classList.add('selected');
                // 同名肌肉全部高亮
                document.querySelectorAll(`.muscle-region[data-muscle="${muscle}"]`).forEach(r => r.classList.add('selected'));
            }
            
            // 显示训练动作并打开面板
            showExercises(muscle);
            openExercisePanel();
        }
        
        // 打开训练面板
        function openExercisePanel() {
            document.getElementById('exercise-panel').classList.add('open');
            document.getElementById('panel-backdrop').classList.add('show');
        }
        
        // 关闭训练面板
        function closeExercisePanel() {
            document.getElementById('exercise-panel').classList.remove('open');
            document.getElementById('panel-backdrop').classList.remove('show');
            // 清除3D模型选中状态
            if (typeof window.resetGLBView === 'function') {
                // 不重置视角，只清除选中
            }
        }
        
        // 放大查看图片
        function zoomImage(src) {
            const modal = document.getElementById('image-zoom-modal');
            const img = document.getElementById('zoom-image');
            img.src = src;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭图片放大
        function closeZoomImage() {
            const modal = document.getElementById('image-zoom-modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }
        
        // ESC 关闭放大
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const zoomModal = document.getElementById('image-zoom-modal');
                if (zoomModal && zoomModal.classList.contains('show')) {
                    closeZoomImage();
                } else if (document.getElementById('login-popup-overlay').classList.contains('show')) {
                    closeLoginPopup();
                } else if (document.getElementById('exercise-panel').classList.contains('open')) {
                    closeExercisePanel();
                }
            }
        });
        
        // 显示登录弹窗
        function showLoginPopup() {
            // 回填记住的账号密码
            const saved = localStorage.getItem('remember_me');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    document.getElementById('popup-username').value = data.username || '';
                    document.getElementById('popup-password').value = data.password || '';
                    document.getElementById('popup-remember').checked = true;
                } catch (e) {}
            }
            document.getElementById('login-popup-overlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭登录弹窗
        function closeLoginPopup() {
            document.getElementById('login-popup-overlay').classList.remove('show');
            document.body.style.overflow = '';
        }
        
        // 弹窗登录
        async function popupLogin() {
            const username = document.getElementById('popup-username').value;
            const password = document.getElementById('popup-password').value;
            const remember = document.getElementById('popup-remember').checked;
            const errEl = document.getElementById('popup-login-error');
            errEl.textContent = '';
            
            // 记住我：保存或清除账号密码
            if (remember) {
                localStorage.setItem('remember_me', JSON.stringify({ username, password }));
            } else {
                localStorage.removeItem('remember_me');
            }
            
            try {
                const res = await fetch(`${BASE}/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.code === 1) {
                    token = data.data.token;
                    closeLoginPopup();
                    // 登录成功后执行生成计划
                    generatePlan();
                } else {
                    errEl.textContent = data.msg || '登录失败';
                }
            } catch (e) {
                // 后端未启动时，模拟登录成功并生成计划
                closeLoginPopup();
                setTimeout(() => generatePlan(), 300);
            }
        }

        function showExercises(muscle) {
            const exercises = exerciseDB[muscle] || [];
            const panel = document.getElementById('exercise-panel');
            
            if (exercises.length === 0) {
                panel.innerHTML = `<button class="panel-close-btn" onclick="closeExercisePanel()">×</button>
                    <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <div class="empty-text">暂无该部位的训练数据</div>
                    <div class="empty-hint">请选择其他肌肉部位</div>
                </div>`;
                return;
            }
            
            let html = `<button class="panel-close-btn" onclick="closeExercisePanel()">×</button>
                <div class="exercise-header">
                <div class="exercise-title">
                    <span class="muscle-name">${muscle}</span> 训练动作
                </div>
                <div class="exercise-count">${exercises.length} 个动作</div>
            </div>
            <div class="exercise-cards">`;
            
            exercises.forEach((ex, i) => {
                html += `<div class="exercise-card" style="animation-delay: ${i * 0.08}s">
                    <div class="exercise-gif-container">
                        ${ex.gif ? `<img src="${ex.gif}" alt="${ex.name}" class="exercise-gif" onclick="zoomImage('${ex.gif}')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">

                                <span class="play-icon">▶</span>
                            </div>
                        </div>`}

                    <div class="exercise-card-content">
                        <div class="exercise-name">${ex.name}</div>
                        <div class="exercise-meta">
                            <span class="meta-item"><strong>${ex.sets}</strong></span>
                            <span class="meta-item"><strong>${ex.reps}</strong></span>
                            <span class="meta-item">${ex.difficulty}</span>
                            <span class="meta-item">${ex.equipment}</span>

            document.getElementById('front-view').classList.toggle('hidden', view !== 'front');
            document.getElementById('back-view').classList.toggle('hidden', view !== 'back');

        // 播放视频 - 显示动作详情弹窗
        function playVideo(name) {
            for (const muscle in exerciseDB) {
                const ex = exerciseDB[muscle].find(e => e.name === name);
                if (ex) {
                    const modal = document.createElement('div');
                    modal.className = 'video-modal';
                    const gifHtml = ex.gif 
                        ? `<img src="${ex.gif}" alt="${ex.name}" class="modal-gif" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                           <div class="modal-placeholder" style="display:none">
                               <div class="big-play-btn"><span class="play-icon">▶</span></div>
                               <p>加载失败</p>
                           </div>`
                        : `<div class="modal-placeholder">
                               <div class="big-play-btn"><span class="play-icon">▶</span></div>
                               <p>暂无演示</p>
                           </div>`;
                    modal.innerHTML = `
                        <div class="video-modal-content">
                            <div class="video-modal-header">
                                <h3>${name}</h3>
                                <button onclick="this.closest('.video-modal').remove()">✕</button>
                            </div>
                            <div class="modal-gif-container">${gifHtml}</div>
                            <div class="modal-info">
                                <div class="modal-info-row">
                                    <span class="modal-label">难度</span>
                                    <span class="modal-value">${ex.difficulty}</span>
                                </div>
                                <div class="modal-info-row">
                                    <span class="modal-label">器械</span>
                                    <span class="modal-value">${ex.equipment}</span>
                                </div>
                                <div class="modal-info-row">
                                    <span class="modal-label">组数</span>
                                    <span class="modal-value">${ex.sets}</span>
                                </div>
                                <div class="modal-info-row">
                                    <span class="modal-label">次数</span>
                                    <span class="modal-value">${ex.reps}</span>
                                </div>
                                <div class="modal-section">
                                    <h4>📝 动作说明</h4>
                                    <p>${ex.instructions}</p>
                                </div>
                                <div class="modal-section">
                                    <h4>💡 训练技巧</h4>
                                    <p>${ex.tips}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    modal.onclick = (e) => {
                        if (e.target === modal) modal.remove();
                    };
                    document.body.appendChild(modal);
                    return;
                }
            }
        }
        
        // 加载统计数据
        async function loadStats() {
            try {
                const [bodyData, calories, workouts] = await Promise.all([
                    fetchAPI('/bodydata/history'),
                    fetchAPI('/food/calories/2026-07-03'),
                    fetchAPI('/workout/list')

        // API请求
        async function fetchAPI(url, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = token;
            
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            
            const res = await fetch(`${BASE}${url}`, options);
            return await res.json();

            if (window.initGLBViewer) {
                window.initGLBViewer();
                return;
            }
            const container = document.getElementById('body-3d-container');
            if (!container) return;

            // 清空容器
            container.innerHTML = '';
            
            // 创建结构
            container.innerHTML = `
                <div class="corner-glow tl"></div>
                <div class="corner-glow br"></div>
                <div class="view-toggle">
                    <button class="active" data-view="front">● 正面</button>
                    <button data-view="back">● 背面</button>
                </div>
                <div class="body-card" id="body-card">
                    <div class="body-face front" id="face-front"></div>
                    <div class="body-face back" id="face-back"></div>
                </div>
                <div class="controls-hint">🖱️ 拖动旋转视角 · 切换正/背面 · 点击肌肉选择</div>
            `;
            
            // 注入SVG
            document.getElementById('face-front').innerHTML = SVG_FRONT;
            document.getElementById('face-back').innerHTML = SVG_BACK;
            
            const card = document.getElementById('body-card');
            const tooltip = document.getElementById('muscle-tooltip');
            
            // 视图切换按钮
            document.querySelectorAll('.view-toggle button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const view = btn.dataset.view;
                    if (view === currentView) return;
                    currentView = view;
                    autoRotate = false;
                    
                    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // 翻转动画
                    if (view === 'back') {
                        targetRotY = 180;
                    } else {
                        targetRotY = 0;
                    }
                    // 重置X方向
                    targetRotX = 0;
                    lastViewToggleClick = Date.now();
                });
            });
            
            // ====== 肌肉交互：正面 ======
            bindMuscleEvents('#face-front', tooltip);
            
            // ====== 肌肉交互：背面 ======
            bindMuscleEvents('#face-back', tooltip);
            
            // ====== 拖动旋转 ======
            container.addEventListener('mousedown', (e) => {
                if (e.target.closest('.view-toggle') || e.target.closest('.view-toggle button')) return;
                if (e.target.closest('.muscle-path')) return; // 点肌肉时不拖动
                isDragging = true;
                autoRotate = false;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                startRotX = targetRotX;
                startRotY = targetRotY;
            });
            
            let dragStartY = 0;
            let startRotX = 0;
            let startRotY = 0;
            
            window.addEventListener('mousemove', (e) => {
                const tooltip = document.getElementById('muscle-tooltip');
                if (isDragging) {
                    const dx = e.clientX - dragStartX;
                    const dy = e.clientY - dragStartY;
                    // 如果是正面视角，拖动方向正常；背面视角则反向
                    const flip = currentView === 'back' ? -1 : 1;
                    targetRotY = startRotY + flip * dx * 0.4;
                    targetRotX = Math.max(-25, Math.min(25, startRotX - dy * 0.25));
                }
            });
            
            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    // 1.5秒后如果没操作，恢复自转
                    setTimeout(() => {
                        if (!isDragging) autoRotate = true;
                    }, 2500);
                }
            });
            
            // 鼠标离开容器
            container.addEventListener('mouseleave', () => {
                tooltip.classList.remove('visible');
                // 悬停样式恢复
                if (!selectedMuscleName) {
                    document.querySelectorAll('.muscle-path.muscle-hover').forEach(el => el.classList.remove('muscle-hover'));
                } else {
                    document.querySelectorAll('.muscle-path').forEach(el => {
                        if (el.dataset.muscle !== selectedMuscleName) {
                            el.classList.remove('muscle-hover');
                        }
                    });
                }
            });
            
            // ====== 动画循环 ======
            function tick() {
                if (autoRotate && !isDragging) {
                    // 微小的自转，让图有呼吸感
                    if (currentView === 'front') {
                        targetRotY += 0.08 * autoRotDir;
                        if (targetRotY > 12) autoRotDir = -1;
                        if (targetRotY < -12) autoRotDir = 1;
                    } else {
                        // 背面基准180度
                        const baseOffset = targetRotY - 180;
                        targetRotY = 180 + baseOffset + 0.08 * autoRotDir;
                        if (baseOffset > 12) autoRotDir = -1;
                        if (baseOffset < -12) autoRotDir = 1;
                    }
                }
                
                // 平滑插值
                cardRotX += (targetRotX - cardRotX) * 0.12;
                cardRotY += (targetRotY - cardRotY) * 0.12;
                
                card.style.transform = `rotateX(${cardRotX}deg) rotateY(${cardRotY}deg)`;
                
                requestAnimationFrame(tick);
            }
            tick();
        }
        
        function bindMuscleEvents(faceSelector, tooltip) {
            const face = document.querySelector(faceSelector);
            if (!face) return;
            
            const allMuscles = face.querySelectorAll('[data-muscle]');
            
            allMuscles.forEach(el => {
                el.addEventListener('mouseenter', (e) => {
                    const name = el.dataset.muscle;
                    
                    // 同组所有肌肉一起高亮
                    document.querySelectorAll(`${faceSelector} [data-muscle="${name}"]`).forEach(m => {
                        if (m.dataset.muscle !== selectedMuscleName) {
                            m.classList.add('muscle-hover');
                        }
                    });
                    
                    document.body.style.cursor = 'pointer';
                });
                
                el.addEventListener('mouseleave', (e) => {
                    const name = el.dataset.muscle;
                    if (name !== selectedMuscleName) {
                        document.querySelectorAll(`${faceSelector} [data-muscle="${name}"]`).forEach(m => {
                            m.classList.remove('muscle-hover');
                        });
                    }
                    document.body.style.cursor = 'default';
                });
                
                el.addEventListener('mousemove', (e) => {
                    tooltip.textContent = el.dataset.muscle;
                    tooltip.style.left = e.clientX + 'px';
                    tooltip.style.top = (e.clientY - 14) + 'px';
                    tooltip.classList.add('visible');
                });
                
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = el.dataset.muscle;
                    selectMuscleByName(name);
                });
            });
        }
        
        function selectMuscleByName(name) {
            // 清除之前选中的
            if (selectedMuscleName) {
                document.querySelectorAll(`[data-muscle="${selectedMuscleName}"]`).forEach(m => {
                    m.classList.remove('muscle-selected');
                });
            }
            
            selectedMuscleName = name;
            
            // 选中高亮（正背面都亮）
            document.querySelectorAll(`[data-muscle="${name}"]`).forEach(m => {
                m.classList.add('muscle-selected');
                m.classList.remove('muscle-hover');
            });
            
            // 调用原有API
            selectMuscle(name, null);
        }


        // 页面加载完成后初始化3D人体
        window.addEventListener('load', function() {
            setTimeout(init3DBody, 500);
        });

</script>
